<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazin Analytics — Carteira de Dividendos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#07090f;--surface:#0c1119;--surface2:#101621;--surface3:#151d2e;
  --border:#1e2840;--border2:#263548;
  --gold:#c9870c;--gold-lt:#e8a930;
  --green:#16a34a;--green-lt:#22c55e;
  --red:#b91c1c;--red-lt:#ef4444;
  --amber-lt:#f59e0b;--blue-lt:#60a5fa;
  --text:#c8d5e8;--text-dim:#7a8fa8;--text-br:#ddeaf8;
  --mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1440px;margin:0 auto;padding:0 1.5rem}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:1.1rem 0;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo h1{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:600;color:var(--gold-lt);letter-spacing:2px}
.logo span{font-size:.68rem;color:var(--text-dim);letter-spacing:3px;text-transform:uppercase;margin-left:.6rem}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem}
.tab-nav{display:flex}
.tab-btn{background:none;border:none;color:var(--text-dim);padding:.85rem 1.5rem;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;border-bottom:2px solid transparent;transition:all .2s}
.tab-btn:hover{color:var(--text)}.tab-btn.active{color:var(--gold-lt);border-color:var(--gold-lt)}
.tab-content{display:none;padding:2rem 0}.tab-content.active{display:block}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.input-card h3{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--gold-lt);margin-bottom:1.25rem;letter-spacing:1px}
.input-row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end}
.input-group{display:flex;flex-direction:column;gap:.35rem}
.input-group label{font-size:.7rem;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase}
.input-group input{background:var(--surface3);border:1px solid var(--border2);color:var(--text-br);padding:.5rem .9rem;border-radius:8px;font-size:.88rem;font-family:'DM Sans',sans-serif;transition:border-color .2s;width:160px}
.input-group input.w-xl{width:340px}
.input-group input:focus{outline:none;border-color:var(--gold)}
.btn{padding:.55rem 1.25rem;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;transition:all .2s}
.btn-add{background:var(--surface3);color:var(--gold-lt);border:1px solid var(--gold)}
.btn-add:hover{background:var(--gold);color:#000}
.btn-analyze{background:linear-gradient(135deg,var(--gold),var(--gold-lt));color:#000;font-weight:600;padding:.6rem 1.75rem;letter-spacing:.5px}
.btn-analyze:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 20px rgba(200,130,12,.35)}
.btn-analyze:disabled{opacity:.4;cursor:not-allowed;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 1.25rem;min-height:1px}
.chip{background:var(--surface3);border:1px solid var(--border2);border-radius:20px;padding:.28rem .85rem;font-size:.77rem;display:flex;align-items:center;gap:.5rem;font-family:var(--mono)}
.chip span{color:var(--gold-lt);font-weight:600}.chip em{color:var(--text-dim);font-style:normal;font-size:.72rem}
.chip button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:.95rem;padding:0;line-height:1}
.chip button:hover{color:var(--red-lt)}

/* FILTER BAR */
.filter-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;padding:.75rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.filter-bar label{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-right:.25rem}
.filter-btn{background:var(--surface3);border:1px solid var(--border2);color:var(--text-dim);padding:.3rem .85rem;border-radius:20px;font-size:.74rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s}
.filter-btn:hover{border-color:var(--gold);color:var(--gold-lt)}
.filter-btn.active{background:rgba(200,130,12,.15);border-color:var(--gold);color:var(--gold-lt);font-weight:600}
.filter-sep{width:1px;height:20px;background:var(--border2);margin:0 .25rem}
.sort-select{background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:.3rem .7rem;border-radius:8px;font-size:.74rem;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none}
.sort-select:focus{border-color:var(--gold)}
.sort-dir{background:var(--surface3);border:1px solid var(--border2);color:var(--text-dim);width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;transition:all .18s}
.sort-dir:hover{border-color:var(--gold);color:var(--gold-lt)}
.filter-count{font-size:.72rem;color:var(--text-dim);margin-left:auto}

/* SUMMARY */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:1rem;margin-bottom:1.5rem}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.2rem}
.s-label{font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem}
.s-value{font-family:var(--mono);font-size:1.3rem;font-weight:600;color:var(--text-br)}
.s-sub{font-size:.72rem;color:var(--text-dim);margin-top:.2rem}
.hl-gold{border-color:var(--gold)}.hl-gold .s-value{color:var(--gold-lt)}

/* SECTOR CHART */
.sector-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.sector-card h3{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--gold-lt);margin-bottom:1.25rem;letter-spacing:1px;display:flex;align-items:center;gap:.6rem}
.sector-card h3 small{font-family:'DM Sans',sans-serif;font-size:.68rem;color:var(--text-dim);font-weight:400;letter-spacing:.5px}
.sector-rows{display:flex;flex-direction:column;gap:.65rem}
.sector-row{display:grid;grid-template-columns:130px 1fr 55px 65px;align-items:center;gap:.75rem}
.sector-label{font-size:.78rem;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:.4rem}
.sector-track{height:8px;background:var(--surface3);border-radius:4px;overflow:hidden}
.sector-fill{height:100%;border-radius:4px;transition:width .4s ease}
.sector-pct{font-family:var(--mono);font-size:.8rem;font-weight:600;text-align:right}
.sector-tickers{font-size:.68rem;color:var(--text-dim)}
.sector-warn{font-size:.68rem;border-radius:4px;padding:.15rem .45rem;white-space:nowrap}
.sector-divider{height:1px;background:var(--border);margin:.5rem 0}
.besst-badge{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .5rem;border-radius:10px;font-size:.65rem;font-weight:700;letter-spacing:.5px;white-space:nowrap}
/* BESST Barsi — destaque */
.bb-B {background:rgba(96,165,250,.15);color:#60a5fa;border:1px solid rgba(96,165,250,.4)}
.bb-E {background:rgba(250,204,21,.15);color:#fde047;border:1px solid rgba(250,204,21,.4)}
.bb-S1{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.4)}
.bb-S2{background:rgba(167,139,250,.15);color:#c4b5fd;border:1px solid rgba(167,139,250,.4)}
.bb-T {background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.4)}
/* Setores fora do BESST */
.bb-ind{background:rgba(99,102,241,.1);color:#818cf8;border:1px solid rgba(99,102,241,.25)}
.bb-con{background:rgba(244,114,182,.1);color:#f472b6;border:1px solid rgba(244,114,182,.25)}
.bb-mat{background:rgba(163,230,53,.1);color:#a3e635;border:1px solid rgba(163,230,53,.25)}
.bb-oil{background:rgba(234,88,12,.1);color:#fb923c;border:1px solid rgba(234,88,12,.25)}
.bb-imb{background:rgba(6,182,212,.1);color:#22d3ee;border:1px solid rgba(6,182,212,.25)}
.bb-ret{background:rgba(248,113,113,.1);color:#fca5a5;border:1px solid rgba(248,113,113,.25)}
.bb-agr{background:rgba(132,204,22,.1);color:#bef264;border:1px solid rgba(132,204,22,.25)}
.bb-tec{background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.25)}
.bb-sau{background:rgba(20,184,166,.1);color:#2dd4bf;border:1px solid rgba(20,184,166,.25)}
.bb-edu{background:rgba(251,191,36,.1);color:#fcd34d;border:1px solid rgba(251,191,36,.25)}
.bb-trp{background:rgba(156,163,175,.1);color:#d1d5db;border:1px solid rgba(156,163,175,.25)}
.bb-out{background:rgba(148,163,184,.08);color:#94a3b8;border:1px solid rgba(148,163,184,.2)}

/* DCA CARD */
.dca-card{background:linear-gradient(135deg,rgba(200,130,12,.07),rgba(200,130,12,.02));border:1px solid rgba(200,130,12,.28);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.dca-card h3{font-size:.72rem;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:1rem}
.dca-items{display:flex;flex-direction:column;gap:.75rem}
.dca-item{padding:.85rem 1rem;background:var(--surface);border-radius:10px;border:1px solid var(--border)}
.dca-item-top{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem;flex-wrap:wrap}
.dca-pos{font-size:.7rem;color:var(--text-dim);min-width:1.5rem}
.dca-ticker{font-family:var(--mono);font-weight:600;color:var(--gold-lt);min-width:60px}
.dca-metrics{font-size:.77rem;color:var(--text-dim);flex:1;display:flex;gap:1rem;flex-wrap:wrap}
.dca-amount{font-family:var(--mono);font-weight:600;color:var(--green-lt);font-size:.9rem;white-space:nowrap}
.dca-rational{font-size:.75rem;color:var(--text-dim);line-height:1.55;padding:.5rem .75rem;background:rgba(200,130,12,.05);border-left:2px solid rgba(200,130,12,.4);border-radius:0 6px 6px 0}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead tr{background:var(--surface2);border-bottom:1px solid var(--border)}
th{padding:.7rem 1rem;text-align:left;font-size:.66rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}
td{padding:.65rem 1rem;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.ticker-cell{display:flex;align-items:center;gap:.6rem}
.t-logo-fb{width:26px;height:26px;border-radius:50%;background:var(--surface3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:var(--gold-lt);flex-shrink:0}
.t-name{font-family:var(--mono);font-weight:600;font-size:.84rem;color:var(--text-br)}
.t-sub{font-size:.68rem;color:var(--text-dim);max-width:130px;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;padding:.22rem .65rem;border-radius:20px;font-size:.68rem;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.b-cf{background:rgba(22,163,74,.15);color:#4ade80;border:1px solid rgba(22,163,74,.3)}
.b-c {background:rgba(29,78,216,.12);color:#60a5fa;border:1px solid rgba(29,78,216,.3)}
.b-a {background:rgba(180,83,9,.12); color:#fbbf24;border:1px solid rgba(180,83,9,.3)}
.b-r {background:rgba(185,28,28,.12);color:#f87171;border:1px solid rgba(185,28,28,.3)}
.b-s3{background:rgba(185,28,28,.15);color:#f87171;border:1px solid rgba(185,28,28,.35)}
.b-s2{background:rgba(234,88,12,.12);color:#fb923c;border:1px solid rgba(234,88,12,.3)}
.b-s1{background:rgba(202,138,4,.12);color:#fbbf24;border:1px solid rgba(202,138,4,.3)}
.b-h {background:rgba(22,163,74,.08); color:#4ade80;border:1px solid rgba(22,163,74,.2)}
.score-wrap{display:flex;align-items:center;gap:.5rem}
.score-num{font-family:var(--mono);font-weight:600;font-size:.88rem;min-width:18px}
.score-bar{height:4px;border-radius:2px;background:var(--border2);min-width:48px;overflow:hidden}
.score-fill{height:100%;border-radius:2px}
.alert-list{display:flex;flex-direction:column;gap:.22rem;max-width:220px}
.alert-item{font-size:.68rem;color:var(--amber-lt);white-space:normal;line-height:1.35}
.no-data{font-size:.72rem;color:var(--text-dim)}
.dc-upcoming{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:6px;font-size:.72rem;font-weight:600;background:rgba(22,163,74,.18);color:#4ade80;border:1px solid rgba(22,163,74,.4);white-space:nowrap}
.dc-soon{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:6px;font-size:.72rem;font-weight:600;background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.35);white-space:nowrap}
.dc-recent{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:6px;font-size:.72rem;color:#94a3b8;border:1px solid var(--border2);white-space:nowrap}
.dc-old{font-size:.72rem;color:var(--text-dim);white-space:nowrap}
.mono{font-family:var(--mono)}
.c-green{color:var(--green-lt)}.c-red{color:var(--red-lt)}.c-amber{color:var(--amber-lt)}.c-gold{color:var(--gold-lt)}.c-dim{color:var(--text-dim)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.section-header h2{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--text-br)}
.section-header span{font-size:.72rem;color:var(--text-dim)}
.footnote{margin-top:.75rem;font-size:.68rem;color:var(--text-dim);line-height:1.6}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem;gap:1rem}
.spinner{width:34px;height:34px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:.82rem;color:var(--text-dim);font-family:var(--mono)}
.empty{text-align:center;padding:3.5rem 1rem;color:var(--text-dim);font-size:.88rem}
.empty .icon{font-size:2.5rem;display:block;margin-bottom:.75rem}
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:.75rem 1.25rem;font-size:.8rem;color:var(--text);z-index:9999;transform:translateY(120px);opacity:0;transition:all .3s ease;max-width:360px;line-height:1.5}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{border-color:var(--red)}.toast.success{border-color:var(--green)}
@media(max-width:768px){
  .input-row{flex-direction:column}.input-group input{width:100% !important}
  .dca-metrics{display:none}.filter-count{display:none}
  .sector-row{grid-template-columns:100px 1fr 45px}
}
/* FILE UPLOAD */
.upload-divider{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0 .9rem}
.upload-divider::before,.upload-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.upload-divider span{font-size:.68rem;color:var(--text-dim);white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
.upload-zone{border:1.5px dashed var(--border2);border-radius:10px;padding:1.1rem 1.5rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface3);user-select:none}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--gold);background:rgba(200,130,12,.07)}
.upload-zone p{font-size:.82rem;color:var(--text-dim);margin:.2rem 0}
.upload-zone small{font-size:.7rem;color:var(--text-dim);opacity:.65}
.import-preview-wrap{background:var(--surface);border:1px solid rgba(200,130,12,.4);border-radius:10px;padding:1.25rem;margin-top:1rem}
.import-preview-wrap h4{font-size:.82rem;color:var(--gold-lt);font-weight:600;margin-bottom:.9rem}
.import-tbl{width:100%;border-collapse:collapse;font-size:.78rem;margin-bottom:.9rem}
.import-tbl th{padding:.35rem .75rem;text-align:left;font-size:.66rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.import-tbl td{padding:.35rem .75rem;border-bottom:1px solid var(--border);font-family:var(--mono)}
.import-tbl tr:last-child td{border-bottom:none}
.row-dup td{color:var(--amber-lt)}
.import-actions{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.btn-import{background:linear-gradient(135deg,var(--green),var(--green-lt));color:#000;font-weight:600;padding:.5rem 1.25rem}
.btn-import:hover{opacity:.9}
.btn-imp-cancel{background:var(--surface3);color:var(--text-dim);border:1px solid var(--border2)}
.btn-imp-cancel:hover{border-color:var(--red-lt);color:var(--red-lt)}
</style>
</head>
<body>
<header>
  <div class="container">
    <div class="header-inner">
      <div class="logo"><h1>BAZIN ANALYTICS<span>Carteira de Dividendos</span></h1></div>
      <span style="font-size:.72rem;color:var(--text-dim)">Yahoo Finance · Estratégia Décio Bazin · BESST Barsi</span>
    </div>
  </div>
</header>
<div class="tabs">
  <div class="container">
    <nav class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('portfolio',this)">📊 Minha Carteira</button>
      <button class="tab-btn" onclick="switchTab('watchlist',this)">🔭 Watchlist</button>
    </nav>
  </div>
</div>

<!-- PORTFOLIO TAB -->
<div id="tab-portfolio" class="tab-content active">
  <div class="container">
    <div class="input-card">
      <h3>✦ Adicionar Ativo à Carteira</h3>
      <div class="input-row">
        <div class="input-group"><label>Ticker</label>
          <input type="text" id="pTicker" placeholder="BBAS3" maxlength="10" onkeydown="if(event.key==='Enter')addPortfolio()"></div>
        <div class="input-group"><label>Preço Médio (R$)</label>
          <input type="number" id="pPrice" placeholder="28.50" step="0.01" min="0" onkeydown="if(event.key==='Enter')addPortfolio()"></div>
        <div class="input-group"><label>Qtd. Ações (opcional)</label>
          <input type="number" id="pQty" placeholder="100" step="1" min="0" onkeydown="if(event.key==='Enter')addPortfolio()"></div>
        <button class="btn btn-add" onclick="addPortfolio()">+ Adicionar</button>
      </div>
      <div class="chips" id="portfolioChips"></div>
      <div class="upload-divider"><span>ou importe um arquivo</span></div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileImport" accept=".csv,.xlsx,.xls" style="display:none">
        <p>📂 Clique ou arraste um arquivo CSV ou Excel</p>
        <small>Colunas esperadas: Ticker &middot; Preço Médio &middot; Qtd (opcional)</small>
      </div>
      <div id="importPreview" style="display:none"></div>
      <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-top:1.25rem">
        <button class="btn btn-analyze" id="btnP" onclick="analyzePortfolio()">⚡ Analisar Carteira</button>
        <span id="hintP" style="font-size:.73rem;color:var(--text-dim)"></span>
      </div>
    </div>
    <div id="portfolioResults"></div>
  </div>
</div>

<!-- WATCHLIST TAB -->
<div id="tab-watchlist" class="tab-content">
  <div class="container">
    <div class="input-card">
      <h3>✦ Watchlist — Análise Bazin + Ranking</h3>
      <div class="input-row">
        <div class="input-group"><label>Ticker(s) — separe por vírgula</label>
          <input type="text" id="wTicker" placeholder="TAEE11, CMIG4, EGIE3, BBSE3" class="w-xl" onkeydown="if(event.key==='Enter')addWatchlist()"></div>
        <button class="btn btn-add" onclick="addWatchlist()">+ Adicionar</button>
      </div>
      <div class="chips" id="watchlistChips"></div>
      <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
        <button class="btn btn-analyze" id="btnW" onclick="analyzeWatchlist()">⚡ Analisar Watchlist</button>
        <span id="hintW" style="font-size:.73rem;color:var(--text-dim)"></span>
      </div>
    </div>
    <div id="watchlistResults"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  BESST — Classificação Barsi
// ══════════════════════════════════════════════
// ── Mapa completo de setores B3 ──────────────────────────
const SECTOR_MAP = {

function detectSector(symbol, sectorAll) {
  const tk = symbol.replace(/\d+$/,'').toUpperCase();
  // 1. Tenta pelo ticker mapeado manualmente
  for (const [cat, list] of Object.entries(TICKER_MAP)) {
    if (list.some(t => tk === t || tk.startsWith(t))) return cat;
  }
  // 2. Fallback por string do setor Yahoo Finance
  if (/bank|financ.*serv|credit/.test(sectorAll) && !/insur/.test(sectorAll)) return 'B';
  if (/insur|previdenc/.test(sectorAll)) return 'S2';
  if (/water|sanit|sewag/.test(sectorAll)) return 'S1';
  if (/utilit|electric|power|energy/.test(sectorAll)) return 'E';
  if (/telecom|communic/.test(sectorAll)) return 'T';
  if (/oil|gas|petrole|fuel/.test(sectorAll)) return 'OIL';
  if (/mining|metal|steel|miner|siderur|iron|copper|celulo|paper/.test(sectorAll)) return 'MAT';
  if (/industri|manufactur|machinery|autopart|aerospace|defense/.test(sectorAll)) return 'IND';
  if (/real.?estate|reit|imov|constru|incorpor/.test(sectorAll)) return 'IMB';
  if (/retail|varejo|apparel|footwear|department/.test(sectorAll)) return 'RET';
  if (/food|beverage|packag|consumer.*staple|aliment|frigorif/.test(sectorAll)) return 'CON';
  if (/agric|agro|crop|sugar|soy/.test(sectorAll)) return 'AGR';
  if (/technolog|software|internet|semicon/.test(sectorAll)) return 'TEC';
  if (/health|hospital|pharma|medic|saude/.test(sectorAll)) return 'SAU';
  if (/educat|ensino|universit/.test(sectorAll)) return 'EDU';
  if (/transport|logistic|airline|railroad|shipping/.test(sectorAll)) return 'TRP';
  return 'OUT';
}

function isBESST(cat) { return SECTOR_MAP[cat]?.besst === true; }

function sectorBadge(cat) {
  const s = SECTOR_MAP[cat] || SECTOR_MAP.OUT;
  const ring = s.besst ? ' style="box-shadow:0 0 0 1px rgba(200,130,12,.5)"' : '';
  return `<span class="besst-badge ${s.color}"${ring}>${s.icon} ${s.label}</span>`;
}

}
function renderChips(){
  document.getElementById('portfolioChips').innerHTML=
    S.portfolio.map(i=>`<div class="chip"><span>${i.ticker}</span><em>PM R$${parseFloat(i.avgPrice).toFixed(2)}${i.qty?' · '+i.qty+' un':''}</em><button onclick="removeP('${i.id}')">×</button></div>`).join('');
  document.getElementById('watchlistChips').innerHTML=
    S.watchlist.map(i=>`<div class="chip"><span>${i.ticker}</span><button onclick="removeW('${i.id}')">×</button></div>`).join('');
}
function addPortfolio(){
  const ticker=document.getElementById('pTicker').value.trim().toUpperCase().replace('.SA','');
  const price=parseFloat(document.getElementById('pPrice').value);
  const qty=parseInt(document.getElementById('pQty').value)||null;
  if(!ticker) return toast('Informe o ticker','error');
  if(!price||price<=0) return toast('Informe o preço médio','error');
  if(S.portfolio.find(p=>p.ticker===ticker)) return toast(`${ticker} já está na carteira`,'error');
  S.portfolio.push({id:crypto.randomUUID(),ticker,avgPrice:price,qty});
  save(); renderChips(); updateHints();
  ['pTicker','pPrice','pQty'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('pTicker').focus();
}
function removeP(id){S.portfolio=S.portfolio.filter(p=>p.id!==id);save();renderChips();updateHints();}
function addWatchlist(){
  const raw=document.getElementById('wTicker').value.trim().toUpperCase();
  if(!raw) return toast('Informe o ticker','error');
  const tickers=raw.split(/[,\s;]+/).map(t=>t.replace('.SA','').trim()).filter(Boolean);
  let added=0;
  tickers.forEach(ticker=>{ if(!S.watchlist.find(w=>w.ticker===ticker)){S.watchlist.push({id:crypto.randomUUID(),ticker});added++;} });
  if(!added) return toast('Ticker(s) já estão na watchlist','error');
  save(); renderChips(); updateHints(); document.getElementById('wTicker').value='';
}
function removeW(id){S.watchlist=S.watchlist.filter(w=>w.id!==id);save();renderChips();updateHints();}

function filterBarHtml(tab,total,filtered){
  const fs=FS[tab];
  const statuses=[
    {k:'all',label:'Todos'},{k:'cf',label:'★ Compra Forte'},
    {k:'compra',label:'Compra'},{k:'aguardar',label:'Aguardar'},
    {k:'reavaliar',label:'Reavaliar'},{k:'besst',label:'Só BESST'},
  ];
  const sorts=tab==='portfolio'
    ?[{k:'score',l:'Score'},{k:'dy',l:'DY %'},{k:'margem',l:'Margem Bazin'},{k:'varPerc',l:'Variação'},{k:'symbol',l:'Ticker'}]
    :[{k:'rank',l:'Ranking'},{k:'score',l:'Score'},{k:'dy',l:'DY %'},{k:'margem',l:'Margem Bazin'},{k:'yearsDiv',l:'Consistência'},{k:'symbol',l:'Ticker'}];
  return `<div class="filter-bar">
    <label>Filtro:</label>
    ${statuses.map(s=>`<button class="filter-btn${fs.filter===s.k?' active':''}" onclick="setFilter('${tab}','${s.k}')">${s.label}</button>`).join('')}
    <div class="filter-sep"></div>
    <label>Ordenar:</label>
    <select class="sort-select" onchange="setSort('${tab}',this.value)">${sorts.map(s=>`<option value="${s.k}"${fs.sortKey===s.k?' selected':''}>${s.l}</option>`).join('')}</select>
    <div class="sort-dir" onclick="toggleSortDir('${tab}')">${fs.sortDir===-1?'↓':'↑'}</div>
    <span class="filter-count">${filtered} de ${total} ativo(s)</span>
  </div>`;
}
function setFilter(tab,val){FS[tab].filter=val;tab==='portfolio'?reRenderPortfolio():reRenderWatchlist();}
function setSort(tab,key){FS[tab].sortKey=key;tab==='portfolio'?reRenderPortfolio():reRenderWatchlist();}
function toggleSortDir(tab){FS[tab].sortDir*=-1;tab==='portfolio'?reRenderPortfolio():reRenderWatchlist();}
function applyFilterSort(items,tab){
  const fs=FS[tab];
  let out=items.filter(item=>{
    if(fs.filter==='all')       return true;
    if(fs.filter==='cf')        return item.status.includes('FORTE');
    if(fs.filter==='compra')    return item.status==='COMPRA';
    if(fs.filter==='aguardar')  return item.status==='AGUARDAR';
    if(fs.filter==='reavaliar') return item.status==='REAVALIAR';
    if(fs.filter==='besst')     return item.besstCat !== 'X';
    return true;
  });
  out.sort((a,b)=>{
    const k=fs.sortKey;
    const va=a[k]??(fs.sortDir===-1?-Infinity:Infinity);
    const vb=b[k]??(fs.sortDir===-1?-Infinity:Infinity);
    if(typeof va==='string') return fs.sortDir*va.localeCompare(vb);
    return fs.sortDir*(vb-va);
  });
  return out;
}

// ── API ────────────────────────────────────────
async function fetchStocks(tickers){
  const BATCH=8,results={};
  for(let i=0;i<tickers.length;i+=BATCH){
    const batch=tickers.slice(i,i+BATCH).join(',');
    try{
      const res=await fetch(`/.netlify/functions/quote?ticker=${encodeURIComponent(batch)}`);
      if(!res.ok){const e=await res.json().catch(()=>({}));toast(`Erro ${res.status}: ${e.error||'API falhou'}`,'error');continue;}
      const json=await res.json();
      if(json.results) Object.assign(results,json.results);
    }catch(e){console.error('Fetch:',e);toast('Erro de conexão','error');}
  }
  return results;
}

//  ANALYSIS ENGINE
// ══════════════════════════════════════════════
function analyzeStock(data,avgPrice=null,qty=null,totalPortValue=null){
  const price=parseFloat(data.regularMarketPrice)||0;
  if(price<=0) return null;
  const lpa=parseFloat(data.earningsPerShare)||0;
  const pl=data.priceEarnings!=null?parseFloat(data.priceEarnings):null;
  const vpa=parseFloat(data.bookValue)||0;
  const h52w=parseFloat(data.fiftyTwoWeekHigh)||0;
  const name=data.shortName||data.longName||data.symbol||'';
  const sectorAll=((data.sector||'')+' '+(data.industry||'')).toLowerCase();
  const besstCat=detectSector(data.symbol||'',sectorAll);

  // ── Dividends — 5-year average (mais estável) ──
  const divs=data.dividendsHistory||[];
  const now=Date.now(),MS1Y=365*86400000;
  const d12m=divs.filter(d=>(now-new Date(d.date))<=MS1Y);
  const d5y =divs.filter(d=>(now-new Date(d.date))<=5*MS1Y);
  const d3y =divs.filter(d=>(now-new Date(d.date))<=3*MS1Y);
  const sumDiv=arr=>arr.reduce((s,d)=>s+(parseFloat(d.amount)||0),0);
  const divL12m_chart=sumDiv(d12m);

  // Agrega por ano
  function avgByYear(arr){
    const byYr={};
    arr.forEach(d=>{const yr=new Date(d.date).getFullYear();byYr[yr]=(byYr[yr]||0)+(parseFloat(d.amount)||0);});
    const vals=Object.values(byYr).filter(v=>v>0);
    return vals.length>0?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  }

  // DY exibido: usa trailingAnnualDividendRate do Yahoo (inclui JCP, mais completo)
  // Fallback para soma manual do chart quando não disponível
  const yahooRate=parseFloat(data.trailingAnnualDividendRate)||0;
  const divL12m=yahooRate>0?yahooRate:divL12m_chart;

  // Teto Bazin: blend estabilidade da média 3a (60%) + recência do L12M chart (40%)
  const avg3y=avgByYear(d3y);
  const divBase=avg3y>0&&divL12m_chart>0?avg3y*0.6+divL12m_chart*0.4:(avg3y||divL12m_chart);

  const dy=price>0?divL12m/price:0;

  // Consistência — anos pagando nos últimos 5 anos
  const byYear5={};
  d5y.forEach(d=>{const yr=new Date(d.date).getFullYear();byYear5[yr]=(byYear5[yr]||0)+(parseFloat(d.amount)||0);});
  const yearsDiv=Object.values(byYear5).filter(v=>v>0).length;

  const payout=lpa>0?divL12m/lpa:null;
  const tetoBazin=divBase>0?divBase/0.06:0;
  const margem=tetoBazin>0?((tetoBazin-price)/price)*100:null;
  const precoGraham=lpa>0&&vpa>0?Math.sqrt(22.5*lpa*vpa):0;
  const precoGordon=divBase>0?(divBase*1.02)/(0.10-0.02):0;

  const besst=isBESST(besstCat);
  const isCiclic=/oil|gas|mining|metal|steel|agric|celulo|paper|coal|petroleo|miner|siderur/.test(sectorAll);
  const queda52w=h52w>0?(price-h52w)/h52w*100:0;

  const totalDebt=parseFloat(data.totalDebt)||0;
  const totalCash=parseFloat(data.totalCash)||0;
  const ebitda=parseFloat(data.ebitda)||0;
  const dlEbitda=ebitda>0?(totalDebt-totalCash)/ebitda:null;

  let score=0;
  const alertas=[];
  if(dy>=0.06) score+=2;
  else if(dy<0.03&&divL12m>0) alertas.push('DY muito baixo (<3%)');
  else if(divL12m===0) alertas.push('Sem dividendos no L12M');
  if(tetoBazin>0&&price<tetoBazin) score+=3;
  else if(tetoBazin>0) alertas.push('Acima do teto Bazin');
  else alertas.push('Sem histórico suficiente');
  if(dlEbitda!==null&&dlEbitda<=3.0) score+=2;
  else if(dlEbitda!==null&&dlEbitda>3.0) alertas.push(`Dívida alta (DL/EBITDA: ${dlEbitda.toFixed(1)}x)`);
  if(besst) score+=1;
  if(isCiclic){score-=1;alertas.push('Setor cíclico');}
  if(payout!==null){
    if(payout>=0.20&&payout<=0.85) score+=1;
    else if(payout>0.85) alertas.push(`Payout elevado (${(payout*100).toFixed(0)}%)`);
  }
  if(yearsDiv>=4) score+=1;
  else if(yearsDiv<2&&divL12m>0) alertas.push('Histórico curto de dividendos');
  if(pl!==null&&!isNaN(pl)){
    if(pl>20){score-=1;alertas.push(`P/L elevado (${pl.toFixed(1)}x)`);}
    else if(pl<0) alertas.push('LPA negativo');
  }
  if(queda52w<-20&&dy>0.10){alertas.push('⚠️ Possível Value Trap');score-=2;}

  let status,bc;
  if(score>=9){status='★ COMPRA FORTE';bc='b-cf';}
  else if(score>=7){status='COMPRA';bc='b-c';}
  else if(score>=4){status='AGUARDAR';bc='b-a';}
  else{status='REAVALIAR';bc='b-r';}

  let sig=null,varPerc=null;
  if(avgPrice&&avgPrice>0){
    varPerc=((price-avgPrice)/avgPrice)*100;
    if(varPerc>=80) sig={lv:3,label:'Vender 75% — 3º nível',bc:'b-s3'};
    else if(varPerc>=50) sig={lv:2,label:'Vender 50% acumulado',bc:'b-s2'};
    else if(varPerc>=30) sig={lv:1,label:'Vender 25%',bc:'b-s1'};
    else sig={lv:0,label:'Manter',bc:'b-h'};
    if(tetoBazin>0&&price>tetoBazin*1.20&&sig.lv===0){
      sig={lv:1,label:'Acima teto Bazin +20% — avaliar',bc:'b-s1'};
      alertas.push('Preço 20%+ acima do teto Bazin');
    }
    if(totalPortValue&&qty){
      const w=(price*qty)/totalPortValue*100;
      if(w>20) alertas.push(`Concentração ${w.toFixed(1)}% — rebalancear`);
    }
  }
  const ey=pl&&pl>0?(1/pl)*100:(lpa>0?lpa/price*100:0);

  // ── Data Com ────────────────────────────────────────────
  // exDividendDate do Yahoo vem como Unix timestamp (segundos)
  function parseDateField(v) {
    if (!v) return null;
    // Unix timestamp
    if (typeof v === 'number' && v > 1e9) return new Date(v * 1000);
    // String ISO
    if (typeof v === 'string' && v.length >= 8) return new Date(v);
    return null;
  }
  const exDate      = parseDateField(data.exDividendDate);
  const lastDivDate = parseDateField(data.lastDividendDate);
  // Usa a mais recente entre as duas como referência
  const dataComRef  = exDate || lastDivDate;
  const hoje        = new Date(); hoje.setHours(0,0,0,0);
  let dataComStatus = null; // 'upcoming' | 'recent' | 'old' | null
  let dataComDias   = null;
  let dataComStr    = null;
  if (dataComRef) {
    const ref = new Date(dataComRef); ref.setHours(0,0,0,0);
    dataComDias = Math.round((ref - hoje) / 86400000);
    dataComStr  = ref.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'});
    if (dataComDias >= 0 && dataComDias <= 15)       dataComStatus = 'upcoming';  // próxima
    else if (dataComDias > 15 && dataComDias <= 45)  dataComStatus = 'soon';      // chegando
    else if (dataComDias < 0 && dataComDias >= -10)  dataComStatus = 'recent';    // passou recentemente
    else                                              dataComStatus = 'old';
  }

  return {
    symbol:data.symbol,name,price,avgPrice,qty,
    divL12m,avg3y,divBase,dy:dy*100,yearsDiv,
    payout:payout!==null?payout*100:null,
    tetoBazin,margem,precoGraham,precoGordon,
    dlEbitda,lpa,vpa,pl,
    roe:parseFloat(data.returnOnEquity)||0,
    score,status,bc,alertas,sig,varPerc,queda52w,ey,
    besstCat,isBESST:besst,isCiclic,
    dataComStr,dataComDias,dataComStatus,
    lastDividendValue: data.lastDividendValue ?? null,
  };
}

function calcRanking(items){
  const valid=items.filter(i=>i.ey>0);
  const rankBy=(arr,key)=>{const s=[...arr].sort((a,b)=>b[key]-a[key]);const r={};s.forEach((i,n)=>{r[i.symbol]=n+1;});return r;};
  const rEY=rankBy(valid,'ey'),rDY=rankBy(valid,'dy');
  items.forEach(i=>{i.rankFM=(rEY[i.symbol]||valid.length+1)+(rDY[i.symbol]||valid.length+1);});
  [...items].sort((a,b)=>(a.rankFM||9999)-(b.rankFM||9999)).forEach((i,n)=>{i.rank=n+1;});
  return items;
}

// ── Sector Distribution Chart ──────────────────
function sectorChartHtml(items){
  // Agrupa por setor
  const groups={};
  let totalVal=0;
  items.forEach(item=>{
    const val=item.price&&item.qty?item.price*item.qty:item.price||0;
    const cat=item.besstCat;
    if(!groups[cat]) groups[cat]={cat,val:0,tickers:[]};
    groups[cat].val+=val;
    groups[cat].tickers.push(item.symbol);
    totalVal+=val;
  });

  // Calcula percentuais
  const rows=Object.values(groups)
    .map(g=>({...g,pct:totalVal>0?g.val/totalVal*100:0}))
    .sort((a,b)=>b.pct-a.pct);

  const IDEAL=30;
  const rowsHtml=rows.map(r=>{
    const b=SECTOR_MAP[r.cat]||SECTOR_MAP.OUT;
    const over=r.pct>IDEAL;
    const near=r.pct>=IDEAL*0.85&&r.pct<=IDEAL;
    const fillColor=over?'var(--red-lt)':near?'var(--amber-lt)':'var(--green-lt)';
    const pctColor=over?'c-red':near?'c-amber':'c-green';
    const warn=over?`<span class="sector-warn" style="color:var(--red-lt);background:rgba(185,28,28,.1);border:1px solid rgba(185,28,28,.25)">▲ ${(r.pct-IDEAL).toFixed(0)}% acima</span>`
               :near?`<span class="sector-warn" style="color:var(--amber-lt)">≈ limite</span>`:'';
    return `<div class="sector-row">
      <div class="sector-label">${sectorBadge(r.cat)}</div>
      <div><div class="sector-track"><div class="sector-fill" style="width:${Math.min(100,r.pct)}%;background:${fillColor}"></div></div>
      <div class="sector-tickers">${r.tickers.join(', ')}</div></div>
      <div class="sector-pct ${pctColor}">${r.pct.toFixed(1)}%</div>
      ${warn||'<div></div>'}
    </div>`;
  }).join('');

  const hasFin=totalVal>0;
  const nota=hasFin?'Baseado no valor de mercado (preço × qtd)':'Adicione quantidades para ver distribuição por valor. Agora mostrando por número de ativos.';

  // Se não tem valor financeiro, usa contagem
  const rowsCount=!hasFin?rows.map(r=>{
    const b=SECTOR_MAP[r.cat]||SECTOR_MAP.OUT;
    const pct=r.tickers.length/items.length*100;
    const fillColor=pct>IDEAL?'var(--red-lt)':pct>=IDEAL*0.85?'var(--amber-lt)':'var(--green-lt)';
    return `<div class="sector-row">
      <div class="sector-label">${sectorBadge(r.cat)}</div>
      <div><div class="sector-track"><div class="sector-fill" style="width:${pct}%;background:${fillColor}"></div></div>
      <div class="sector-tickers">${r.tickers.join(', ')}</div></div>
      <div class="sector-pct">${pct.toFixed(0)}%</div><div></div>
    </div>`;
  }).join(''):'';

  return `<div class="sector-card">
    <h3>🗂️ Distribuição por Setor BESST <small>ideal: ≤ 30% por setor · linha Barsi</small></h3>
    <div class="sector-rows">${hasFin?rowsHtml:rowsCount}</div>
    <div class="footnote" style="margin-top:.75rem">${nota}</div>
  </div>`;
}

// ── Racional DCA ──────────────────────────────
function buildRational(item,pos){
  const parts=[];
  const s=SECTOR_MAP[item.besstCat]||SECTOR_MAP.OUT;
  if(item.score>=9) parts.push(`score máximo (${item.score}/11) — passa em todos os critérios Bazin`);
  else if(item.score>=7) parts.push(`score sólido de ${item.score}/11`);
  if(item.dy>=8) parts.push(`DY de ${item.dy.toFixed(1)}% — renda acima da média`);
  else if(item.dy>=6) parts.push(`DY de ${item.dy.toFixed(1)}% — mínimo Bazin atendido`);
  if(item.margem!==null){
    if(item.margem>=20) parts.push(`${item.margem.toFixed(0)}% abaixo do teto Bazin — excelente margem`);
    else if(item.margem>=10) parts.push(`${item.margem.toFixed(0)}% abaixo do teto Bazin — boa margem de entrada`);
  }
  if(item.yearsDiv>=5) parts.push(`5 anos consecutivos de dividendos`);
  else if(item.yearsDiv>=4) parts.push(`${item.yearsDiv} anos pagando dividendos`);
  if(item.isBESST&&s.besst) parts.push(`setor ${s.label} (${s.icon} BESST Barsi) — receita previsível e regulada`);
  if(item.dlEbitda!==null&&item.dlEbitda<=1.5) parts.push(`baixíssima alavancagem (${item.dlEbitda.toFixed(1)}x DL/EBITDA)`);
  else if(item.dlEbitda!==null&&item.dlEbitda<=3) parts.push(`dívida controlada (${item.dlEbitda.toFixed(1)}x DL/EBITDA)`);
  if(pos===0) parts.push(`melhor posição no ranking Greenblatt da watchlist`);
  else if(pos===1) parts.push(`2ª melhor posição no ranking`);
  return (parts.length?parts.join(', '):'Melhor combinação de DY e score disponível')+'.';
}

  return `<span class="mono ${item.price<item.tetoBazin?'c-green':'c-red'}">R$${item.tetoBazin.toFixed(2)}</span>`;

function margemHtml(item){

//  FILE IMPORT (CSV / XLSX)
// ══════════════════════════════════════════════
let _importItems=[];

async function processImportFile(file){
  const ext=file.name.split('.').pop().toLowerCase();
  let rows;
  try{
    if(ext==='csv'){
      const text=await file.text();
      rows=parseCSVRows(text);
    }else if(ext==='xlsx'||ext==='xls'){
      if(!window.XLSX) return toast('Biblioteca XLSX não carregada. Recarregue a página.','error');
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    }else{
      return toast('Formato não suportado. Use CSV ou XLSX.','error');
    }
  }catch(e){console.error(e);return toast('Erro ao ler o arquivo.','error');}
  if(!rows||rows.length<2) return toast('Arquivo sem dados suficientes.','error');
  const{items,error}=mapImportRows(rows);
  if(error) return toast(error,'error');
  if(!items.length) return toast('Nenhum ativo válido encontrado no arquivo.','error');
  showImportPreview(items);
}

function parseCSVRows(text){
  const lines=text.trim().split(/\r?\n/);
  const first=lines[0];
  const delim=[',',';','\t'].reduce((b,d)=>first.split(d).length>first.split(b).length?d:b,',');
  return lines.map(l=>l.split(delim).map(c=>c.trim().replace(/^["']|["']$/g,'')));
}

function normHeader(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'_');
}

function parseImportPrice(raw){
  let s=String(raw).replace(/[R$\s]/g,'').trim();
  const ld=s.lastIndexOf('.');
  const lc=s.lastIndexOf(',');
  if(ld>lc) s=s.replace(/,/g,'');
  else if(lc>ld) s=s.replace(/\./g,'').replace(',','.');
  return parseFloat(s)||0;
}

function mapImportRows(rows){
  const headers=rows[0].map(normHeader);
  const ALIASES={
    ticker:['ticker','ativo','codigo','papel','sigla','stock','symbol','acoes','acao'],
    avgPrice:['preco_medio','pm','preco_compra','preco_aquisicao','avg_price','average_price',
              'preco','price','custo_medio','valor_medio','preco_unitario','vl_pm'],
    qty:['quantidade','qtd','qty','cotas','shares','quantity','posicao','saldo','qtde'],
  };
  const col={};
  for(const[f,als]of Object.entries(ALIASES)){
    for(const a of als){const i=headers.indexOf(a);if(i!==-1){col[f]=i;break;}}
    if(col[f]===undefined){
      const i=headers.findIndex(h=>als.some(a=>h.startsWith(a)||a.startsWith(h)));
      if(i!==-1) col[f]=i;
    }
  }
  if(col.ticker===undefined||col.avgPrice===undefined)
    return{items:[],error:`Colunas não encontradas. Cabeçalhos detectados: ${rows[0].slice(0,8).join(', ')}`};
  const items=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(!r||r.every(c=>!String(c).trim())) continue;
    const ticker=String(r[col.ticker]||'').trim().toUpperCase().replace(/\.SA$/,'').replace(/\s/g,'');
    const price=parseImportPrice(r[col.avgPrice]);
    const qty=col.qty!==undefined?parseInt(String(r[col.qty]||'').replace(/[^\d]/g,''))||null:null;
    if(!ticker||ticker.length<3) continue;
    if(!price||price<=0) continue;
    const isDup=S.portfolio.some(p=>p.ticker===ticker);
    items.push({ticker,avgPrice:price,qty,isDup});
  }
  return{items,error:null};
}

function showImportPreview(items){
  _importItems=items.filter(i=>!i.isDup);
  const dups=items.filter(i=>i.isDup);
  const el=document.getElementById('importPreview');
  el.style.display='block';
  const trs=items.map(i=>`<tr${i.isDup?' class="row-dup"':''}>
    <td>${i.ticker}</td><td>R$${i.avgPrice.toFixed(2)}</td><td>${i.qty??'—'}</td>
    <td style="font-size:.7rem;color:${i.isDup?'var(--amber-lt)':'var(--green-lt)'}">${i.isDup?'⚠️ já existe':'✓ novo'}</td></tr>`).join('');
  el.innerHTML=`<div class="import-preview-wrap">
    <h4>📋 Prévia — ${items.length} ativo(s) detectado(s)</h4>
    <div style="overflow-x:auto"><table class="import-tbl">
      <thead><tr><th>Ticker</th><th>Preço Médio</th><th>Qtd</th><th>Status</th></tr></thead>
      <tbody>${trs}</tbody></table></div>
    ${dups.length?`<p style="font-size:.72rem;color:var(--amber-lt);margin-bottom:.75rem">⚠️ ${dups.length} ativo(s) já existem na carteira e serão ignorados.</p>`:''}
    <div class="import-actions">
      <button class="btn btn-import" onclick="confirmImport()">✓ Adicionar ${_importItems.length} ativo(s)</button>
      <button class="btn btn-imp-cancel" onclick="cancelImport()">Cancelar</button>
      <span style="font-size:.72rem;color:var(--text-dim)">${_importItems.length} novo(s)${dups.length?` · ${dups.length} ignorado(s)`:''}</span>
    </div></div>`;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function confirmImport(){
  if(!_importItems.length) return toast('Nenhum ativo novo para adicionar.','error');
  _importItems.forEach(item=>{
    if(!S.portfolio.find(p=>p.ticker===item.ticker))
      S.portfolio.push({id:crypto.randomUUID(),ticker:item.ticker,avgPrice:item.avgPrice,qty:item.qty});
  });
  const n=_importItems.length;
  _importItems=[];
  save();renderChips();updateHints();cancelImport();
  toast(`${n} ativo(s) importado(s) com sucesso!`,'success');
}

function cancelImport(){
  const el=document.getElementById('importPreview');
  el.style.display='none';el.innerHTML='';_importItems=[];
}

init();
</script>
</body>
</html>
